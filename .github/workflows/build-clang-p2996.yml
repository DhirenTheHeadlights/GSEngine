name: build-clang-p2996

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (leave blank to auto-generate clang-p2996-vN+1)"
        required: false
      sha:
        description: "clang-p2996 commit SHA to pin (leave blank for branch tip)"
        required: false
      branch:
        description: "Source branch"
        required: false
        default: "p2996"
      draft:
        description: "Create release as draft"
        required: false
        default: "true"
  schedule:
    - cron: '0 6 * * 1'

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.r.outputs.skip }}
      tag: ${{ steps.r.outputs.tag }}
      sha: ${{ steps.r.outputs.sha }}
      branch: ${{ steps.r.outputs.branch }}
      draft: ${{ steps.r.outputs.draft }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          branch="${INPUT_BRANCH:-p2996}"
          sha="${INPUT_SHA:-}"
          if [[ -z "$sha" ]]; then
            sha=$(gh api "repos/bloomberg/clang-p2996/commits/$branch" --jq .sha)
          fi
          short_sha="${sha:0:12}"

          skip=false
          if latest_body=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .body 2>/dev/null); then
            if printf '%s' "$latest_body" | grep -q "$short_sha"; then
              echo "Branch tip $short_sha already published in latest release; skipping"
              skip=true
            fi
          fi

          tag="${INPUT_TAG:-}"
          if [[ -z "$tag" ]]; then
            max=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].tag_name' \
              | sed -nE 's/^clang-p2996-v([0-9]+)$/\1/p' \
              | sort -n | tail -1)
            max=${max:-0}
            tag="clang-p2996-v$((max + 1))"
          fi

          draft="${INPUT_DRAFT:-false}"

          {
            echo "skip=$skip"
            echo "branch=$branch"
            echo "sha=$sha"
            echo "tag=$tag"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"

          echo "resolved: branch=$branch sha=$sha tag=$tag draft=$draft skip=$skip"

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Free runner disk space
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
            "$env:AGENT_TOOLSDIRECTORY\Ruby" , `
            "$env:AGENT_TOOLSDIRECTORY\Go" , `
            "$env:AGENT_TOOLSDIRECTORY\PyPy" , `
            "$env:AGENT_TOOLSDIRECTORY\CodeQL"
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Build clang-p2996
        shell: pwsh
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          python scripts/build_clang_p2996.py --branch "${{ needs.resolve.outputs.branch }}" --sha "${{ needs.resolve.outputs.sha }}" --link-jobs 1

      - name: Compute artifact SHA256
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/clang-p2996-windows-x64.zip).Hash.ToLower()
          Write-Output "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Output "SHA256: $hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clang-p2996-windows-x64
          path: dist/clang-p2996-windows-x64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          draft: ${{ needs.resolve.outputs.draft == 'true' }}
          files: dist/clang-p2996-windows-x64.zip
          body: |
            Prebuilt `clang-p2996` toolchain for Windows x64.

            - Branch: `${{ needs.resolve.outputs.branch }}`
            - SHA: `${{ needs.resolve.outputs.sha }}`
            - SHA256: `${{ steps.hash.outputs.sha256 }}`

            ## Install

            ```
            python scripts/install_clang_p2996.py --tag ${{ needs.resolve.outputs.tag }} --sha256 ${{ steps.hash.outputs.sha256 }} --persist
            ```
